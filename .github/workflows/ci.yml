name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SASSUOLO_DB_PATH: .tmp/ci-sassuolo.db
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: git lfs fsck
      - run: npm run check:secrets
      - run: npm run check:supply-chain:audit
      - run: npm run data:release:check
      - run: npm run ops:sbom
      - run: npm run check
      - run: npm test
      - run: npm run build
        env:
          # Verifica il bundle realmente distribuito: NODE_ENV=test include le
          # build di sviluppo di React e rende il budget non rappresentativo.
          NODE_ENV: production
      - run: npm run perf:archive
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - name: Smoke test immagine di produzione
        run: docker build -t sassuolo-history-ci .
      - run: npm run db:migrate
      - run: npm run data:audit:full
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-sbom
          path: sbom.cdx.json
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-audit
          path: data/reconciliation/audits/audit-full-*.json
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
