name: Release container
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run check:secrets
      - run: npm run check:supply-chain:audit
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Digest immutabile
        run: echo "Image digest ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
  staging-smoke:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Avvia staging dallo stesso digest della release
        run: docker volume create sassuolo-staging-data && docker run -d --name sassuolo-staging -p 8787:8787 -v sassuolo-staging-data:/data -e NODE_ENV=production -e ADMIN_API_TOKEN=staging-smoke-token -e CORS_ORIGINS=http://127.0.0.1:8787 ghcr.io/${{ github.repository }}@${{ needs.publish.outputs.digest }}
      - name: Attendi health check
        run: for i in {1..30}; do curl --fail --silent http://127.0.0.1:8787/api/health && exit 0; sleep 2; done; docker logs sassuolo-staging; exit 1
      - name: Smoke funzionale
        run: npm run ops:smoke
        env:
          SMOKE_BASE_URL: http://127.0.0.1:8787
      - name: Log container su errore
        if: failure()
        run: docker logs sassuolo-staging
  promote:
    needs: [publish, staging-smoke]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promuovi esclusivamente il digest verificato
        run: docker buildx imagetools create --tag ghcr.io/${{ github.repository }}:production ghcr.io/${{ github.repository }}@${{ needs.publish.outputs.digest }}
      - run: echo "Promosso ${{ needs.publish.outputs.digest }} dopo smoke staging" >> "$GITHUB_STEP_SUMMARY"
